services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: juridico
      POSTGRES_PASSWORD: juridico
      POSTGRES_DB: portal_juridico
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: juridico
      MINIO_ROOT_PASSWORD: juridico123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 juridico juridico123; do sleep 1; done;
      mc mb -p local/portal-juridico-anexos;
      mc anonymous set download local/portal-juridico-anexos;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
